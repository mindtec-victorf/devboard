name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Unit, CLI, server and installer tests (browser tests skip without Playwright)
        working-directory: skills/devboard
        run: python -m pytest -q
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.ps1 from this checkout (PowerShell 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.codex" | Out-Null
          $env:DEVBOARD_SRC = "${{ github.workspace }}"
          ./install.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1
          $cli = Join-Path $env:LOCALAPPDATA "devboard\bin\devboard.cmd"
          & $cli --help | Select-Object -First 2
          if ($LASTEXITCODE -ne 0) { throw "devboard.cmd failed" }
          if (-not (Test-Path "$HOME\.codex\skills\devboard\SKILL.md")) { throw "skill not linked" }
          if (-not (Select-String -Path "$HOME\.codex\AGENTS.md" -Pattern "devboard inbox" -Quiet)) { throw "AGENTS.md block missing" }
          $env:DEVBOARD_HOME = Join-Path $env:RUNNER_TEMP "db"
          & $cli init demo --title "Demo" --repo .
          & $cli add 1 --board demo --title "Windows works"
          & $cli summary --board demo
      - name: hook command under Git Bash
        shell: bash
        run: |
          export CLAUDE_PLUGIN_ROOT="$PWD" DEVBOARD_HOME="$RUNNER_TEMP/db"
          cmd=$(python -c "import json;print(json.load(open('hooks/hooks.json'))['hooks']['SessionStart'][0]['hooks'][0]['command'])")
          echo "{\"cwd\": \"$(pwd -W)\"}" | sh -c "$cmd" | python -c "import json,sys; d=json.load(sys.stdin); assert 'Board demo' in d['hookSpecificOutput']['additionalContext'], d; print('hook ok')"
